<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automation Tasks</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #111826;
    --panel-2: #0f1622;
    --line: rgba(120, 160, 220, 0.12);
    --txt: #d7e2f0;
    --dim: #7d8aa0;
    --cyan: #38bdf8;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --violet: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #13233b 0%, transparent 60%),
                radial-gradient(900px 500px at 0% 110%, #1a1440 0%, transparent 55%),
                var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 28px 20px 60px; line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .logo { width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    box-shadow: 0 0 18px rgba(56,189,248,0.55); display: grid; place-items: center;
    font-weight: 700; color: #06121f; font-size: 17px; }
  h1 { font-size: 20px; font-weight: 700; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .chip .n { color: var(--txt); font-weight: 700; }
  .chip.verified { color: var(--green); border-color: rgba(52,211,153,0.35); }
  .chip.verified .n { color: var(--green); }

  .domain { margin-top: 22px; }
  .domain-title { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .domain-title .d { font-size: 13px; font-weight: 600; letter-spacing: 0.3px; color: var(--cyan); }
  .domain-title .cnt { font-size: 11px; color: var(--dim); }
  .domain-title::after { content: ""; height: 1px; flex: 1; background: var(--line); }
  .grid { display: grid; gap: 12px; }

  .task { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; cursor: pointer; transition: border-color .18s, box-shadow .18s, transform .12s; }
  .task:hover { border-color: rgba(120,160,220,0.32); box-shadow: 0 0 0 1px rgba(56,189,248,0.15); }
  .task .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .task .name { font-weight: 700; font-size: 15px; }
  .badge { font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.6px; }
  .badge.verified { color: var(--green); background: rgba(52,211,153,0.12); }
  .badge.unverified { color: var(--amber); background: rgba(251,191,36,0.12); }
  .ver { font-size: 11px; color: var(--dim); font-family: ui-monospace, Menlo, monospace; }
  .task .desc { color: var(--dim); font-size: 12.5px; margin-top: 5px; }
  .task .meta { display: flex; gap: 14px; margin-top: 10px; font-size: 11.5px; color: var(--dim); flex-wrap: wrap; }
  .task .meta b { color: var(--txt); font-weight: 600; }
  .meta .s { color: var(--green); } .meta .b { color: var(--amber); } .meta .f { color: var(--red); }

  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(4,7,12,0.7); backdrop-filter: blur(4px);
    display: none; align-items: flex-start; justify-content: center; padding: 30px 16px; z-index: 50; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    width: 100%; max-width: 900px; padding: 24px 26px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .modal .mhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .modal .mname { font-size: 19px; font-weight: 700; }
  .close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--dim);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1; }
  .close:hover { color: var(--txt); border-color: rgba(120,160,220,0.4); }
  .mdesc { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .msection { margin-top: 20px; }
  .msection h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--dim); margin-bottom: 10px; }

  /* inputs + run */
  .inputs { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; color: var(--dim); }
  .field input { background: var(--panel-2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; width: 180px; outline: none; }
  .field input:focus { border-color: rgba(56,189,248,0.5); box-shadow: 0 0 0 2px rgba(56,189,248,0.15); }
  .field .req { color: var(--red); }
  .field .hint { font-size: 10.5px; color: var(--dim); }
  button.run { background: linear-gradient(135deg, var(--cyan), #2563eb); color: #06121f; border: none;
    font-weight: 700; font-size: 13.5px; padding: 10px 20px; border-radius: 9px; cursor: pointer;
    box-shadow: 0 0 16px rgba(56,189,248,0.4); }
  button.run:hover { filter: brightness(1.08); }
  button.run:disabled { opacity: 0.5; cursor: not-allowed; }

  .result { margin-top: 14px; border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line); display: none; }
  .result.success { display: block; border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.06); }
  .result.failure { display: block; border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.06); }
  .result.business_outcome { display: block; border-color: rgba(251,191,36,0.4); background: rgba(251,191,36,0.06); }
  .result .rlabel { font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
  .result.success .rlabel { color: var(--green); } .result.failure .rlabel { color: var(--red); }
  .result.business_outcome .rlabel { color: var(--amber); }
  .result .rdiag { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
  .result img { margin-top: 10px; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }

  /* steps */
  .step { border: 1px solid var(--line); border-left: 3px solid var(--cyan); border-radius: 10px;
    padding: 12px 14px; background: var(--panel-2); margin-bottom: 8px; }
  .step .shead { display: flex; align-items: center; gap: 9px; }
  .step .snum { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--dim); }
  .step .saction { font-size: 13px; font-weight: 700; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.5px; }
  .step .sval { font-size: 12.5px; color: var(--violet); font-family: ui-monospace, Menlo, monospace; }
  .step .sval .param { color: var(--amber); }
  .loc { margin-top: 8px; font-size: 12px; color: var(--dim); font-family: ui-monospace, Menlo, monospace; }
  .loc b { color: var(--txt); font-weight: 600; }
  .step .reason { margin-top: 6px; font-size: 11.5px; color: var(--dim); font-style: italic; }
  .step .assert { margin-top: 6px; font-size: 11.5px; color: var(--dim); }

  /* screenshots */
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .shot { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); }
  .shot img { width: 100%; display: block; border-bottom: 1px solid var(--line); }
  .shot .lbl { font-size: 11px; color: var(--dim); padding: 6px 9px; }

  .runs { display: flex; flex-direction: column; gap: 6px; }
  .runrow { display: flex; align-items: center; gap: 10px; font-size: 12.5px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .runrow:last-child { border-bottom: none; }
  .pill { font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.5px; }
  .pill.success { color: var(--green); background: rgba(52,211,153,0.12); }
  .pill.business_outcome { color: var(--amber); background: rgba(251,191,36,0.12); }
  .pill.failure { color: var(--red); background: rgba(248,113,113,0.12); }

  .empty { color: var(--dim); font-size: 13px; padding: 14px 0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #0f1a2b; border: 1px solid var(--line); color: var(--txt); padding: 10px 18px;
    border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">AT</div>
    <div>
      <h1>Automation Tasks</h1>
      <div class="sub">Replayable capabilities, grouped by target domain</div>
    </div>
    <div class="stats">
      <span class="chip">Tasks <span class="n" id="sTotal">–</span></span>
      <span class="chip verified">Verified <span class="n" id="sVerified">–</span></span>
      <span class="chip">Unverified <span class="n" id="sUnverified">–</span></span>
    </div>
  </header>
  <div id="domains"></div>
</div>

<!-- task detail modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const RESULT = { success: 'Success', business_outcome: 'Business outcome', failure: 'Failure' };

function fmtRunStats(r) {
  if (!r) return '';
  return `<span class="s">${r.success} ok</span> · <span class="b">${r.business_outcome} business</span> · <span class="f">${r.failure} failed</span>`;
}

async function loadTasks() {
  const res = await fetch('/api/tasks');
  const data = await res.json();
  const s = data.summary || {};
  $('#sTotal').textContent = s.total ?? 0;
  $('#sVerified').textContent = s.verified ?? 0;
  $('#sUnverified').textContent = s.unverified ?? 0;

  // group by domain
  const byDomain = {};
  for (const t of (data.tasks || [])) {
    const d = t.domain || '(unknown domain)';
    (byDomain[d] ||= []).push(t);
  }

  const domains = Object.keys(byDomain).sort();
  $('#domains').innerHTML = domains.length
    ? domains.map(d => `
      <div class="domain">
        <div class="domain-title"><span class="d">${esc(d)}</span><span class="cnt">${byDomain[d].length} task(s)</span></div>
        <div class="grid">${byDomain[d].map(taskCard).join('')}</div>
      </div>`).join('')
    : '<div class="empty">No tasks yet — record a capability first.</div>';

  document.querySelectorAll('.task').forEach(el => el.onclick = () => openTask(el.dataset.name));
}

function taskCard(t) {
  return `
    <div class="task" data-name="${esc(t.name)}">
      <div class="row1">
        <span class="name">${esc(t.name)}</span>
        <span class="badge ${t.verified ? 'verified' : 'unverified'}">${t.verified ? 'verified' : 'unverified'}</span>
        <span class="ver">v${esc(t.version)}</span>
      </div>
      <div class="desc">${esc(t.description)}</div>
      <div class="meta">
        <span><b>${t.steps_count}</b> steps</span>
        <span>${fmtRunStats(t.runs)}</span>
        <span>${(t.inputs || []).map(i => i.name).join(', ') || 'no inputs'}</span>
      </div>
    </div>`;
}

async function openTask(name) {
  const res = await fetch('/api/task/' + encodeURIComponent(name));
  const t = await res.json();
  if (t.error) { toast(t.error); return; }
  renderModal(t);
  $('#overlay').classList.add('open');
}

function renderModal(t) {
  const inputsHtml = (t.inputs || []).map(i => `
    <div class="field">
      <label>${esc(i.name)}${i.required ? ' <span class="req">*</span>' : ''}</label>
      <input type="text" data-input="${esc(i.name)}" placeholder="${esc(i.type || 'str')}">
      ${i.description ? `<span class="hint">${esc(i.description)}</span>` : ''}
    </div>`).join('');

  const stepsHtml = (t.steps || []).map((s, i) => {
    const target = s.target || {};
    let loc = '';
    if (target.strategy === 'accessibility') {
      loc = `strategy=accessibility · role=<b>"${esc(target.role)}"</b>`;
      if (target.name) loc += ` · name=<b>"${esc(target.name)}"</b>`;
      if (target.ordinal != null) loc += ` · ordinal=${target.ordinal}`;
    } else if (target.strategy) {
      loc = `strategy=${esc(target.strategy)} · value=<b>"${esc(target.value)}"</b>`;
    }
    const val = s.value ? `<span class="sval">= ${highlight(s.value)}</span>` : '';
    const assert = s.assertion ? `<div class="assert">expect: "${esc(s.assertion.expect)}"</div>` : '';
    const reason = target.reasoning ? `<div class="reason">${esc(target.reasoning)}</div>` : '';
    return `
      <div class="step">
        <div class="shead">
          <span class="snum">step ${i + 1}</span>
          <span class="saction">${esc(s.action)}</span>${val}
        </div>
        ${loc ? `<div class="loc">${loc}</div>` : ''}
        ${assert}${reason}
      </div>`;
  }).join('');

  const shotsHtml = (t.screenshots || []).map(s => `
    <div class="shot"><img src="${esc(s.url)}" alt="${esc(s.label)}"><div class="lbl">${esc(s.label)}</div></div>`).join('');

  const runsHtml = (t.runs && t.runs.total) ? `
    <div class="runs">
      <div class="runrow"><span class="pill success">success</span><span>${t.runs.success}</span></div>
      <div class="runrow"><span class="pill business_outcome">business</span><span>${t.runs.business_outcome}</span></div>
      <div class="runrow"><span class="pill failure">failure</span><span>${t.runs.failure}</span></div>
    </div>` : '<div class="empty">No runs recorded yet.</div>';

  $('#modal').innerHTML = `
    <div class="mhead">
      <span class="mname">${esc(t.name)}</span>
      <span class="ver">v${esc(t.version)}</span>
      <span class="badge verified" style="background:rgba(56,189,248,0.12);color:var(--cyan)">${esc(t.domain || 'unknown')}</span>
      <button class="close" onclick="$('#overlay').classList.remove('open')">✕</button>
    </div>
    <div class="mdesc">${esc(t.description)}${t.checkpoint ? ' · Checkpoint: ' + esc(t.checkpoint) : ''}</div>

    <div class="msection">
      <h3>Run a test — fill inputs</h3>
      <div class="inputs">${inputsHtml || '<span class="empty">This task takes no inputs.</span>'}</div>
      <button class="run" style="margin-top:12px" onclick="runTest('${esc(t.name)}')">▶ Run test</button>
      <div class="result" id="result"></div>
    </div>

    <div class="msection">
      <h3>Replayable path & locators</h3>
      ${stepsHtml || '<div class="empty">No steps.</div>'}
    </div>

    <div class="msection">
      <h3>Page screenshots</h3>
      <div class="shots">${shotsHtml || '<div class="empty">No screenshots.</div>'}</div>
    </div>

    <div class="msection">
      <h3>Recent runs</h3>
      ${runsHtml}
    </div>`;
}

function highlight(v) {
  // highlight {param} placeholders
  return esc(v).replace(/\{(\w+)\}/g, '<span class="param">{$1}</span>');
}

async function runTest(name) {
  const inputs = {};
  document.querySelectorAll('[data-input]').forEach(el => {
    if (el.value.trim() !== '') inputs[el.dataset.input] = el.value.trim();
  });
  const res = await fetch('/api/run', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ task: name, inputs })
  });
  const r = await res.json();
  const box = $('#result');
  if (r.error) { toast('Error: ' + r.error); return; }
  box.className = 'result ' + r.result;
  box.innerHTML = `
    <div class="rlabel">${RESULT[r.result] || r.result}</div>
    ${r.diagnostic ? `<div class="rdiag">${esc(r.diagnostic)}</div>` : ''}
    ${r.screenshot ? `<img src="${esc(r.screenshot)}" onerror="this.style.display='none'">` : ''}`;
}

$('#overlay').addEventListener('click', e => { if (e.target === $('#overlay')) $('#overlay').classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#overlay').classList.remove('open'); });

loadTasks();
</script>
</body>
</html>
