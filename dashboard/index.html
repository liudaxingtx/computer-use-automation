<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Dashboard · Computer-Use Automation</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #111826;
    --panel-2: #0f1622;
    --line: rgba(120, 160, 220, 0.12);
    --txt: #d7e2f0;
    --dim: #7d8aa0;
    --cyan: #38bdf8;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --violet: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #13233b 0%, transparent 60%),
                radial-gradient(900px 500px at 0% 110%, #1a1440 0%, transparent 55%),
                var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 28px 20px 60px;
    line-height: 1.5;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  /* header */
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .logo {
    width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.55);
    display: grid; place-items: center; font-weight: 700; color: #06121f; font-size: 18px;
  }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.2px; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .mock {
    margin-left: auto; font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .mock.up { color: var(--green); border-color: rgba(52,211,153,0.35); box-shadow: 0 0 10px rgba(52,211,153,0.15); }
  .mock.down { color: var(--red); border-color: rgba(248,113,113,0.35); }

  /* progress bar */
  .progress { margin: 18px 0 6px; }
  .progress .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.05); overflow: hidden; }
  .bar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    box-shadow: 0 0 12px rgba(52,211,153,0.6);
    border-radius: 999px; transition: width .5s ease;
  }

  /* sections & cards */
  section { margin-top: 26px; }
  .sec-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim);
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .sec-title::after { content: ""; height: 1px; flex: 1; background: var(--line); }
  .grid { display: grid; gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; transition: transform .12s ease, border-color .2s, box-shadow .2s;
  }
  .card:hover { border-color: rgba(120,160,220,0.25); }

  /* phase cards */
  .phase { display: flex; align-items: center; gap: 12px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto;
    border: 2px solid var(--dim); background: transparent;
  }
  .phase.done .dot {
    background: var(--green); border-color: var(--green);
    box-shadow: 0 0 12px rgba(52,211,153,0.7);
  }
  .phase .t { flex: 1; font-size: 14px; }
  .phase.done .t { color: var(--dim); text-decoration: line-through; text-decoration-color: rgba(125,138,160,0.5); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .badge.done { color: var(--green); background: rgba(52,211,153,0.1); }
  .badge.todo { color: var(--amber); background: rgba(251,191,36,0.1); }

  /* submission checklist (clickable) */
  .check {
    display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none;
    padding: 13px 16px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line); transition: border-color .2s;
  }
  .check:hover { border-color: rgba(120,160,220,0.3); }
  .box {
    width: 20px; height: 20px; border-radius: 6px; flex: 0 0 auto;
    border: 1.5px solid var(--dim); display: grid; place-items: center; font-size: 13px;
    color: transparent; transition: all .15s;
  }
  .check.done .box {
    background: var(--cyan); border-color: var(--cyan); color: #06121f;
    box-shadow: 0 0 12px rgba(56,189,248,0.55);
  }
  .check .t { flex: 1; font-size: 14px; }
  .check.done .t { color: var(--dim); text-decoration: line-through; }

  /* telemetry cards */
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    flex: 1; min-width: 110px; text-align: center; padding: 14px 8px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .stat .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--dim); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.6px; }
  .stat.s .n { color: var(--green); text-shadow: 0 0 14px rgba(52,211,153,0.5); }
  .stat.b .n { color: var(--amber); text-shadow: 0 0 14px rgba(251,191,36,0.5); }
  .stat.f .n { color: var(--red); text-shadow: 0 0 14px rgba(248,113,113,0.5); }

  /* capability card */
  .cap { display: flex; align-items: center; gap: 12px; }
  .cap .ic {
    width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    box-shadow: 0 0 14px rgba(167,139,250,0.4); display: grid; place-items: center;
    color: #0a0e14; font-weight: 700;
  }
  .cap .info { flex: 1; }
  .cap .name { font-weight: 600; font-size: 14px; }
  .cap .desc { color: var(--dim); font-size: 12px; }
  .tag { font-size: 11px; color: var(--violet); border: 1px solid rgba(167,139,250,0.35); padding: 1px 8px; border-radius: 999px; }

  /* failure inbox */
  .fail { border-left: 3px solid var(--red); }
  .fail.resolved { border-left-color: var(--dim); opacity: 0.6; }
  .fail .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fail .id { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--dim); flex: 1; word-break: break-all; }
  .fail .diag { font-size: 13px; margin-top: 8px; color: var(--txt); }
  .fail .shot { margin-top: 10px; }
  .fail .shot img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 8px;
    cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--txt);
    transition: all .15s;
  }
  button:hover { border-color: rgba(120,160,220,0.4); }
  button.primary { background: linear-gradient(135deg, var(--cyan), #2563eb); color: #06121f; border: none; box-shadow: 0 0 14px rgba(56,189,248,0.4); }
  button.danger { color: var(--red); border-color: rgba(248,113,113,0.4); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* recent runs timeline */
  .run { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .run:last-child { border-bottom: none; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.5px; }
  .pill.success { color: var(--green); background: rgba(52,211,153,0.12); }
  .pill.business_outcome { color: var(--amber); background: rgba(251,191,36,0.12); }
  .pill.failure { color: var(--red); background: rgba(248,113,113,0.12); }
  .run .when { color: var(--dim); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; margin-left: auto; }

  .empty { color: var(--dim); font-size: 13px; padding: 10px 0; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #0f1a2b; border: 1px solid var(--line); color: var(--txt);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: all .25s; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">CU</div>
    <div>
      <h1>Computer-Use Automation</h1>
      <div class="sub">Task 管理 · interface.ai 面试项目</div>
    </div>
    <div class="mock" id="mock">mock: …</div>
  </header>

  <div class="progress">
    <div class="meta">
      <span>总进度</span>
      <span id="progText">…</span>
    </div>
    <div class="bar"><i id="progBar"></i></div>
  </div>

  <section>
    <div class="sec-title">项目进度 · Phases</div>
    <div class="grid" id="phases"></div>
  </section>

  <section>
    <div class="sec-title">提交收尾 · 点按切换状态</div>
    <div class="grid" id="submission"></div>
  </section>

  <section>
    <div class="sec-title">系统运行 · 能力 & 遥测</div>
    <div class="grid" id="caps"></div>
    <div class="grid" id="telemetry" style="margin-top:12px"></div>
  </section>

  <section>
    <div class="sec-title">失败 Inbox</div>
    <div class="grid" id="failures"></div>
  </section>

  <section>
    <div class="sec-title">最近运行</div>
    <div class="card" id="recent"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); };

const RESULT_LABEL = { success: '成功', business_outcome: '业务结果', failure: '失败' };

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-CN', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3,'0').slice(0,2);
}

function render(s) {
  // progress
  const pct = s.progress.total ? Math.round(s.progress.total_done / s.progress.total * 100) : 0;
  $('#progBar').style.width = pct + '%';
  $('#progText').textContent = `${s.progress.total_done}/${s.progress.total} · ${pct}%`;

  // mock status
  const m = $('#mock');
  if (s.mock_up) { m.textContent = 'mock: 在线'; m.className = 'mock up'; }
  else { m.textContent = 'mock: 离线'; m.className = 'mock down'; }

  // phases
  $('#phases').innerHTML = s.phases.map(p => `
    <div class="card phase ${p.done ? 'done' : ''}">
      <span class="dot"></span>
      <span class="t">${p.title}</span>
      <span class="badge ${p.done ? 'done' : 'todo'}">${p.done ? '完成' : '待办'}</span>
    </div>`).join('');

  // submission checklist
  $('#submission').innerHTML = s.submission.map(t => `
    <div class="check ${t.done ? 'done' : ''}" data-id="${t.id}">
      <span class="box">✓</span>
      <span class="t">${t.title}</span>
    </div>`).join('');
  document.querySelectorAll('.check').forEach(el => {
    el.onclick = () => post('/api/task/toggle', { id: el.dataset.id });
  });

  // capabilities
  $('#caps').innerHTML = s.capabilities.length
    ? s.capabilities.map(c => `
      <div class="card cap">
        <div class="ic">⚙</div>
        <div class="info">
          <div class="name">${c.name}</div>
          <div class="desc">${c.description || ''}</div>
        </div>
        <span class="tag">v${c.version} · ${c.steps} 步</span>
      </div>`).join('')
    : '<div class="empty">暂无 capability（先跑 scripts/save_artifact.py）</div>';

  // telemetry
  $('#telemetry').innerHTML = s.telemetry.map(t => `
    <div class="card">
      <div style="font-size:12.5px;color:var(--dim);margin-bottom:10px">${t.capability} · v${t.version}</div>
      <div class="stat-row">
        <div class="stat s"><div class="n">${t.success}</div><div class="l">成功</div></div>
        <div class="stat b"><div class="n">${t.business_outcome}</div><div class="l">业务结果</div></div>
        <div class="stat f"><div class="n">${t.failure}</div><div class="l">失败</div></div>
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:10px">成功率 ${Math.round(t.success_rate*100)}% · 共 ${t.total} 次运行</div>
    </div>`).join('');

  // failures
  $('#failures').innerHTML = s.failures.length
    ? s.failures.map(f => `
      <div class="card fail ${f.resolved ? 'resolved' : ''}">
        <div class="head">
          <span class="id">${f.run_id}</span>
          <span class="badge ${f.resolved ? 'todo' : 'done'}">${f.resolved ? '已解决' : '未解决'}</span>
        </div>
        <div class="diag">${f.diagnostic || ''}</div>
        ${f.screenshot ? `<div class="shot"><img src="/${f.screenshot}" onerror="this.style.display='none'"></div>` : ''}
        <div class="btns">
          <button class="primary" data-replay="${f.run_id}">↻ Replay 复现</button>
          ${!f.resolved ? `<button class="danger" data-resolve="${f.run_id}">✓ Resolve 解决</button>` : ''}
        </div>
      </div>`).join('')
    : '<div class="card"><div class="empty">暂无失败 — 一切正常</div></div>';
  document.querySelectorAll('[data-replay]').forEach(b => b.onclick = () => replay(b.dataset.replay));
  document.querySelectorAll('[data-resolve]').forEach(b => b.onclick = () => post('/api/resolve', { run_id: b.dataset.resolve }));

  // recent runs
  $('#recent').innerHTML = s.recent.length
    ? s.recent.map(r => `
      <div class="run">
        <span class="pill ${r.result}">${RESULT_LABEL[r.result] || r.result}</span>
        <span>${r.capability}</span>
        <span class="when">${fmtTime(r.started_at)}</span>
      </div>`).join('')
    : '<div class="empty">暂无运行记录</div>';
}

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json();
  if (res.ok && data.progress !== undefined) { render(data); toast('已更新'); }
  else if (res.ok) { toast(`结果: ${data.result || 'ok'}`); }
  else { toast('错误: ' + (data.error || res.status)); }
}

async function replay(id) {
  toast('正在复现失败…（需要 mock 在线）');
  const res = await fetch('/api/replay', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ run_id: id }) });
  const data = await res.json();
  if (res.ok) toast(`复现结果: ${data.result}${data.diagnostic ? ' — ' + data.diagnostic : ''}`);
  else toast('错误: ' + (data.error || res.status));
  refresh();
}

async function refresh() {
  const res = await fetch('/api/state');
  render(await res.json());
}

refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
